name: Build Arch Linux V3 Dual-Edition Live USB ISO (GUI Installer Fixed)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Disk Space on Runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Build Live USB ISO inside Privileged Arch Container
        run: |
          # Antisipasi jika user mengupload isi folder di root maupun di dalam subfolder archv3/
          if [ -f "archv3/build-iso.sh" ] && [ ! -f "build-iso.sh" ]; then
            shopt -s dotglob
            mv archv3/* .
            rmdir archv3 || true
          fi
          chmod +x build-iso.sh install-arch-live.sh setup-arch-v3-dual.sh arch-v3-welcome.sh scripts/arch-v3-launch-installer.sh make-live-usb.sh
          docker run --privileged --rm -e WORKSPACE=/workspace -v "$PWD":/workspace archlinux:latest bash /workspace/build-iso.sh

      - name: Upload ISO to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1-gui-fixed-${{ github.run_number }}
          name: "Arch Linux Custom V3.1 Live USB ISO (GUI Installer - MacBook A1708 & Acer Nitro V16)"
          body: |
            **Arch Linux Custom V3.1 (Full Fixed Edition)**
            - **Live Desktop Grafis (XFCE):** Langsung boot ke desktop grafis dengan ikon installer di Desktop & Autostart Welcome GUI.
            - **GUI Installer Interaktif (Zenity + Live Engine):** Pilih profil hardware (MacBook Pro A1708 / Acer Nitro V 16), pilih Desktop Environment (KDE Plasma, GNOME, XFCE, atau Hyprland), pilih mode Erase Disk (ext4 / btrfs) atau Partisi Manual, dan konfigurasi akun user melalui jendela grafis.
            - **Bebas Error Build:** Tidak lagi gagal karena dependensi AUR Calamares kosong; seluruh komponen menggunakan paket resmi Arch Linux yang teruji.
          files: |
            out-iso/*.iso
            out-iso/*.sha256
